{{ define "main" }}
{{- $posts := sort (where .Site.RegularPages "Section" "in" site.MainSections) "Date" "desc" -}}
<article class="site-search quiet-page" data-search-endpoint="{{ "index.json" | relLangURL }}" data-search-one="{{ i18n "search_one" }}" data-search-many="{{ i18n "search_many" }}" data-search-none="{{ i18n "search_no_results" }}" data-search-error="{{ i18n "search_error" }}">
  <p class="search-status" data-search-status aria-live="polite"></p>
  <div data-search-results hidden></div>
  {{ partial "search-result-template.html" . }}
  <div data-search-entries>
    {{- range $posts }}
      {{- partial "publication-entry.html" (dict "page" . "showSummary" true) -}}
    {{- end }}
  </div>
  <noscript><p>{{ i18n "search_no_script" }}</p></noscript>
</article>
{{ end }}
