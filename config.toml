# Configuração principal do FariaBlog — uma casa para leitura.
baseURL = "https://fariablog.com/"
title = "FariaBlog"
defaultContentLanguage = "pt-br"
defaultContentLanguageInSubdir = true
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[taxonomies]
  tag = "tags"

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "github"

[params]
  authorName = "Lucas Faria"
  description = "Uma casa para leitura. Ensaios e notas de Lucas Faria sobre filosofia, literatura, neurociência e educação, com uma estante de livros lidos."
  keywords = ["filosofia", "literatura", "neurociência", "educação", "leitura", "reflexões", "blog", "pensamento crítico"]
  showToc = true
  mainSections = ["posts"]
  rssLimit = 20
  editBaseURL = "https://github.com/FariaDev/fariablog/edit/main"

[languages]
  [languages.pt-br]
    contentDir = "content/pt-br"
    weight = 1
    title = "FariaBlog"
    [languages.pt-br.params]
      locale = "pt-BR"
      languageLabel = "Português"
      description = "Uma casa para leitura. Ensaios e notas de Lucas Faria sobre filosofia, literatura, neurociência e educação, com uma estante de livros lidos."
      keywords = ["filosofia", "literatura", "neurociência", "educação", "leitura", "reflexões", "blog", "pensamento crítico"]
      dateFormat = "02/01/2006"
      homeInfoContent = "Compartilhando insights, reflexões e descobertas. Um espaço para explorar o que estou lendo, estudando e pensando no momento."
      [languages.pt-br.params.editPost]
        contentDir = "content/pt-br"

  [languages.en]
    contentDir = "content/en"
    weight = 2
    title = "FariaBlog"
    [languages.en.params]
      locale = "en-US"
      languageLabel = "English"
      description = "A house for reading. Essays and notes by Lucas Faria on philosophy, literature, neuroscience, and education, alongside a shelf of books read."
      keywords = ["philosophy", "literature", "neuroscience", "education", "reading", "reflections", "blog", "critical thinking"]
      dateFormat = "Jan 02, 2006"
      homeInfoContent = "Sharing insights, reflections, and discoveries. A space to explore what I'm reading, studying, and thinking about right now."
      [languages.en.params.editPost]
        contentDir = "content/en"


[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[pagination]
  pagerSize = 10

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"
